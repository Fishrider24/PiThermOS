<!DOCTYPE html>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thermostat">
   <head>
      <title>Temp Sensor data </title>
      <link rel="stylesheet" href='../static/style.css'/>
   </head>
   <body>
	<h1>Temp Sensor Data </h1>
	<h3> TEMPERATURE   ==>  {{ temp }}&deg;F</h3>
	<h3> HUMIDITY   ==>   {{ hum }}%</h3>
	<hr>	
	<h3> Last Sensors Reading: {{ datetime }} ==> <a href="/graph"class="button">REFRESH</a></h3>	
	<hr>
	<h3><a href="/"><input type="image" src="/static/images/home.png" alt="Home" width="100" height="100"></a></h3>	
	<hr>
	<h3> HISTORICAL DATA </h3>
	<p> Enter number of hours to retrieve:
	<form method="POST">
		<input name="numSamples" pattern="[0-9]*" step="0.01" value= {{getSamples}}>
		<input type="submit">
		</form></p>
	<hr>
	<img src="/plot/temp" alt="Image Placeholder" width="49%">
	<img src="/plot/hum" alt="Image Placeholder" width="49%">
	<p> @2018 Developed by MJRoBot.org</p>
   </body>
</html>
