<!DOCTYPE html>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thermostat">
	   <head>
		<style>
		body {background-color: powderblue;}
		</style>
		<h1><center><style="font-size:55px">Set Heat Schedule</style></center></h1>
		<link rel="stylesheet" href='../static/style.css'/>
	</head>
	<body>
		<h3><a href="/"><input type="image" src="/static/images/home.png" alt="Home" width="100" height="100"></a>
		<a href='/settings'><input type="image" src="/static/images/settings.png" alt="Settings" width="100" height="100"></a></h3>

		<hr>
		<form method="POST">
<!--<form action="#">-->
			<label for="day">Days:</label>
			<select name="day" id="day" size="4" required>
				<option input type="text" value="Weekday">Weekdays</option>
				<option input type="text" value="Weekend">Weekend</option>
			</select>
<!--      <input type="submit" value="Submit" />-->
<!--</form>-->

			<label for="hours">Hours:</label>
			<input type="text" pattern="[0-9]*" name="hours" maxlength="4" size="10" required>
			<label for="minutes">Minutes:</label>
			<input type="text" pattern="[0-9]*" name="minutes" maxlength="4" size="10" required>
			<label for="am/pm">am/pm:</label>
			<input type="text" style="text-transform: lowercase;" name="am/pm" maxlength="2" size="4" required>
			<label for="temp">Temp:</label>
			<input type="text" pattern="[0-9]*" name="temp" maxlength="4" size="10" required>
			<input type="submit">
<!--			Time: {{time1}} Temp: {{temp1}}&deg-->
		</form></p>
	<table>
	<tbody>
			<tr>
				<td style="font-size:25px"><pre><b>Day      Time      Temp</b></pre></td>
			</tr>
			<tr>
	{% for row in data %}
				<td style="font-size:25px"><pre><center>{{row[5]}}  {{row[1]}}:{{row[2]}} {{row[3]}}    {{row[4]}}   </center></pre></td>
			<td>
				<form method="POST" action="/heatdelete/">
					<input type="hidden" name="id" value="{{row[0]}}">
					<button class="btn btn-primary" style="font-size:20px" type="delete">Delete</button>
				</form>
			</td>
			</tr>
	{% endfor %}
<!--			<tr>
				<td>{{time2[0]}}       {{time2[1]}}</td>
			</tr>
			<tr>
				<td>{{temp2[0]}}       {{temp2[1]}}</td>
			</tr>-->
	</tbody>
	</table>
		<hr>
	</body>
</html>
